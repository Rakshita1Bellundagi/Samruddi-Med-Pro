<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicines - SAMRUDDI MEDICAL SHOP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="wrapper">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-clinic-medical me-2"></i>SAMRUDDI MEDICAL SHOP</h3>
            </div>

            <ul class="list-unstyled components">
                <li>
                    <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                </li>
                <li>
                    <a href="medicines.html" class="active"><i class="fas fa-pills"></i> Medicines</a>
                </li>
                <li>
                    <a href="inventory.html"><i class="fas fa-boxes"></i> Inventory</a>
                </li>
                <li>
                    <a href="billing.html"><i class="fas fa-file-invoice-dollar"></i> Billing</a>
                </li>
                <li>
                    <a href="customers.html"><i class="fas fa-users"></i> Customers</a>
                </li>
                <li>
                    <a href="reports.html"><i class="fas fa-chart-line"></i> Reports</a>
                </li>
                <li>
                    <a href="login.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </li>
            </ul>
        </nav>

        <!-- Page Content -->
        <div id="content">
            <nav class="navbar navbar-expand-lg navbar-light bg-light rounded shadow-sm mb-4">
                <div class="container-fluid">
                    <button type="button" id="sidebarCollapse" class="btn btn-primary">
                        <i class="fas fa-bars"></i>
                    </button>
                    <span class="navbar-brand ms-3">Medicine Management</span>
                </div>
            </nav>

            <div class="row">
                <div class="col-lg-12">
                    <div class="card mb-4">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="input-group w-50">
                                    <span class="input-group-text bg-white border-end-0"><i
                                            class="fas fa-search text-muted"></i></span>
                                    <input type="text" id="medicineSearch" class="form-control border-start-0 ps-0"
                                        placeholder="Search by Medicine Name or Salt Composition...">
                                </div>
                                <button class="btn btn-primary" data-bs-toggle="modal"
                                    data-bs-target="#addMedicineModal">
                                    <i class="fas fa-plus me-2"></i> Add Medicine
                                </button>
                            </div>

                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Medicine Name</th>
                                            <th>Salt Composition</th>
                                            <th>Batch No</th>
                                            <th>Quantity</th>
                                            <th>Expiry Date</th>
                                            <th>Price (₹)</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="medicine-table-body">
                                        <!-- Dynamic Data will be loaded here -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Add Medicine Modal -->
    <div class="modal fade" id="addMedicineModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Medicine</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <input type="hidden" name="id">
                        <div class="mb-3">
                            <label class="form-label">Medicine Name</label>
                            <input type="text" class="form-control" name="name" placeholder="e.g. Dolo 650" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Salt Composition</label>
                            <input type="text" class="form-control" name="salt" placeholder="e.g. Paracetamol 650mg">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Batch No</label>
                                <input type="text" class="form-control" name="batchNo" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">MRP (₹)</label>
                                <input type="number" class="form-control" name="mrp" step="0.01" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Quantity (Strips/Units)</label>
                                <input type="number" class="form-control" name="stock" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Expiry Date</label>
                                <input type="date" class="form-control" name="expiry" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" name="type">
                                <option selected>Tablet</option>
                                <option>Syrup</option>
                                <option>Injection</option>
                                <option>Cream</option>
                                <option>Other</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save Medicine</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/medicines.js"></script>
    <script>
        // Sidebar Collapse (Already in script.js but inline for safety if script.js not fully linked or simple enough)
        document.getElementById('sidebarCollapse').addEventListener('click', function () {
            document.getElementById('sidebar').classList.toggle('active');
        });
    </script>
</body>

</html>
